[project]
name = "winidx"
version = "0.1.0"
description = "Motherboard driver index: crawl vendor support sites, dedup artefacts, compute the water-level metric"
requires-python = ">=3.14"
dependencies = [
    "camoufox>=0.4.11",
    "curl-cffi>=0.13",
    "playwright>=1.62.0",
    "selectolax>=0.3",
]

[project.scripts]
winidx = "winidx.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/winidx"]
